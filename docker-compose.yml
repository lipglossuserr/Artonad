services:
  db:
    image: postgis/postgis:18-3.6
    container_name: artonad-db18
    restart: unless-stopped
    environment:
      POSTGRES_DB: artonad
      POSTGRES_USER: artonad
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - artonad_pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artonad -d artonad"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: artonad-backend:dev
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/artonad
      DB_USER: artonad
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ARTONAD_JWT_SECRET: ${ARTONAD_JWT_SECRET:?Set ARTONAD_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  artonad_pg18_data:
    external: true