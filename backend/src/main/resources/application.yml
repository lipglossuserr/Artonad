
spring:
  application:
    name: artonad-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/artonad}
    username: ${DB_USER:artonad}
    password: ${DB_PASSWORD:artonad}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
