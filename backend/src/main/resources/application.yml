spring:
  application:
    name: artonad-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/artonad}
    username: ${DB_USER:artonad}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${ARTONAD_JWT_SECRET}